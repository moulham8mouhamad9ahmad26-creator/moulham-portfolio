<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملهم أحمد | Web & App Development</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color:#030014; --card-bg:rgba(12,9,28,.85);
            --neon-purple:#9d4edd; --neon-blue:#00f2fe; --neon-green:#00f5d4;
            --text-main:#fff; --text-muted:#94a3b8;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;scroll-behavior:smooth}
        body{
            background-color:var(--bg-color);
            background-image:radial-gradient(circle at 10% 20%,rgba(157,78,221,.35) 0%,transparent 40%),
            radial-gradient(circle at 90% 80%,rgba(0,242,254,.35) 0%,transparent 40%),
            radial-gradient(circle at 50% 50%,rgba(0,245,212,.2) 0%,transparent 50%);
            background-size:250% 250%;animation:bgMove 10s ease infinite alternate;color:var(--text-main);
            min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:20px;overflow-x:hidden;perspective:1000px
        }
        @keyframes bgMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
        .container{width:100%;max-width:450px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:25px;animation:fadeIn 1s cubic-bezier(.16,1,.3,1)}
        @keyframes fadeIn{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
        .profile-card{
            background:var(--card-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
            border-radius:30px;padding:40px 20px;width:100%;text-align:center;position:relative;overflow:hidden;
            transform-style:preserve-3d;transition:transform .1s ease,box-shadow .3s ease;
            box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 25px rgba(157,78,221,.3),0 0 50px rgba(0,242,254,.2);
            border:2px solid transparent;background-image:linear-gradient(var(--card-bg),var(--card-bg)),
            linear-gradient(135deg,var(--neon-blue),var(--neon-purple),var(--neon-green));
            background-origin:border-box;background-clip:padding-box,border-box;animation:cardFloat 4s ease-in-out infinite alternate
        }
        @keyframes cardFloat{
            0%{transform:translateY(0) rotateX(0) rotateY(0);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(157,78,221,.4)}
            100%{transform:translateY(-8px) rotateX(2deg) rotateY(-2deg);box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 45px rgba(0,242,254,.6),0 0 70px rgba(157,78,221,.5)}
        }
        .profile-card::before{
            content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
            background:radial-gradient(circle,rgba(0,242,254,.15) 0%,rgba(157,78,221,.1) 40%,transparent 70%);
            animation:lightRotate 8s linear infinite;pointer-events:none
        }
        @keyframes lightRotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .logo-container{
            width:115px;height:115px;margin:0 auto 20px;border-radius:50%;background:#000;
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 0 30px rgba(0,242,254,.6),inset 0 0 20px rgba(157,78,221,.7);
            border:2px solid var(--neon-blue);position:relative;z-index:2;animation:pulseLogo 3s ease-in-out infinite
        }
        @keyframes pulseLogo{
            0%,100%{transform:scale(1);box-shadow:0 0 25px rgba(0,242,254,.5),inset 0 0 15px rgba(157,78,221,.5)}
            50%{transform:scale(1.08);box-shadow:0 0 50px rgba(0,242,254,.9),0 0 75px rgba(157,78,221,.8),inset 0 0 25px rgba(0,242,254,.7)}
        }
        .logo-container::after{
            content:'';position:absolute;inset:-7px;border-radius:50%;border:2px dashed var(--neon-purple);
            animation:rotateGlow 7s linear infinite;pointer-events:none
        }
        @keyframes rotateGlow{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .logo-text{
            font-size:40px;font-weight:900;background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 25px rgba(0,242,254,.5);letter-spacing:2px
        }
        .name-ar{font-size:26px;font-weight:800;margin-bottom:4px;position:relative;z-index:2}
        .name-en{font-size:15px;color:var(--neon-blue);font-weight:600;margin-bottom:14px;text-shadow:0 0 12px rgba(0,242,254,.5);position:relative;z-index:2}
        .tagline{
            font-size:13px;color:var(--neon-green);background:rgba(0,245,212,.1);padding:6px 16px;border-radius:20px;
            display:inline-block;margin-bottom:16px;border:1px solid rgba(0,245,212,.4);font-weight:600;
            box-shadow:0 0 15px rgba(0,245,212,.25);animation:tagPulse 2s ease-in-out infinite alternate;position:relative;z-index:2
        }
        @keyframes tagPulse{0%{box-shadow:0 0 10px rgba(0,245,212,.2)}100%{box-shadow:0 0 25px rgba(0,245,212,.6)}}
        .bio{font-size:14px;color:var(--text-muted);line-height:1.6;max-width:90%;margin:auto;position:relative;z-index:2}
        .social-links{width:100%;display:flex;flex-direction:column;gap:20px}
        .social-btn{
            display:flex;align-items:center;justify-content:space-between;background:var(--card-bg);
            backdrop-filter:blur(15px);padding:16px 22px;border-radius:18px;color:var(--text-main);
            text-decoration:none;font-weight:600;font-size:15px;position:relative;overflow:hidden;
            transition:all .3s cubic-bezier(.175,.885,.32,1.275)
        }
        .social-btn .btn-content{display:flex;align-items:center;gap:15px;z-index:1}
        .social-btn i{font-size:22px;transition:transform .3s ease}
        .social-btn .fa-chevron-left{font-size:12px;opacity:.6;transition:transform .3s ease;z-index:1}
        .social-btn.youtube{border:2px solid rgba(255,0,0,.6);animation:ytWobble 2.5s ease-in-out infinite}
        @keyframes ytWobble{0%,100%{transform:translateY(0) scale(1);box-shadow:0 0 15px rgba(255,0,0,.3)}50%{transform:translateY(-6px) scale(1.02);box-shadow:0 0 35px rgba(255,0,0,.8),inset 0 0 15px rgba(255,0,0,.4)}}
        .social-btn.youtube i:first-child{color:#f00;text-shadow:0 0 12px #f00}
        .social-btn.youtube:hover{background:rgba(255,0,0,.25);transform:scale(1.06) translateY(-8px)!important;box-shadow:0 0 50px rgba(255,0,0,.9)!important;animation:none}
        .social-btn.youtube:hover i:first-child{transform:scale(1.3) rotate(12deg)}
        .social-btn.instagram{border:2px solid rgba(225,48,108,.6);animation:igWobble 2.5s ease-in-out infinite;animation-delay:.4s}
        @keyframes igWobble{0%,100%{transform:translateY(0) scale(1);box-shadow:0 0 15px rgba(225,48,108,.3)}50%{transform:translateY(-6px) scale(1.02);box-shadow:0 0 35px rgba(225,48,108,.8),inset 0 0 15px rgba(225,48,108,.4)}}
        .social-btn.instagram i:first-child{color:#e1306c;text-shadow:0 0 12px #e1306c}
        .social-btn.instagram:hover{background:rgba(225,48,108,.25);transform:scale(1.06) translateY(-8px)!important;box-shadow:0 0 50px rgba(225,48,108,.9)!important;animation:none}
        .social-btn.instagram:hover i:first-child{transform:scale(1.3) rotate(12deg)}
        .social-btn.facebook{border:2px solid rgba(24,119,242,.6);animation:fbWobble 2.5s ease-in-out infinite;animation-delay:.8s}
        @keyframes fbWobble{0%,100%{transform:translateY(0) scale(1);box-shadow:0 0 15px rgba(24,119,242,.3)}50%{transform:translateY(-6px) scale(1.02);box-shadow:0 0 35px rgba(24,119,242,.8),inset 0 0 15px rgba(24,119,242,.4)}}
        .social-btn.facebook i:first-child{color:#1877f2;text-shadow:0 0 12px #1877f2}
        .social-btn.facebook:hover{background:rgba(24,119,242,.25);transform:scale(1.06) translateY(-8px)!important;box-shadow:0 0 50px rgba(24,119,242,.9)!important;animation:none}
        .social-btn.facebook:hover i:first-child{transform:scale(1.3) rotate(12deg)}
        .social-btn:hover .fa-chevron-left{transform:translateX(-6px);opacity:1}
        footer{margin-top:15px;text-align:center;font-size:13px;color:var(--text-muted);display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
        .footer-socials{display:flex;gap:20px;font-size:18px}
        .footer-socials a{color:var(--text-muted);transition:all .3s ease}
        .footer-socials a:hover{color:var(--neon-blue);text-shadow:0 0 12px var(--neon-blue);transform:scale(1.2)}
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card" id="profileCard">
            <div class="logo-container"><span class="logo-text">M.A</span></div>
            <h1 class="name-ar">ملهم أحمد</h1>
            <div class="name-en">Moulham Ahmad</div>
            <div class="tagline">Web &amp; App Development</div>
            <p class="bio">أشارك رحلتي في تطوير المواقع والتطبيقات من الأساسيات وحتى بناء مشاريع حقيقية</p>
        </div>
        <div class="social-links">
            <a href="https://www.youtube.com/@MoulhammAhmad" target="_blank" rel="noopener noreferrer" class="social-btn youtube">
                <div class="btn-content"><i class="fa-brands fa-youtube"></i><span>قناة اليوتيوب</span></div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a href="https://www.instagram.com/mouham.ahmad1?stkn=MXA2MXZnZWF2engzNQ==" target="_blank" rel="noopener noreferrer" class="social-btn instagram">
                <div class="btn-content"><i class="fa-brands fa-instagram"></i><span>صفحة الانستغرام</span></div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a href="https://www.facebook.com/share/1BFCRRVY5h/" target="_blank" rel="noopener noreferrer" class="social-btn facebook">
                <div class="btn-content"><i class="fa-brands fa-facebook"></i><span>صفحة الفيسبوك</span></div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>
        <footer>
            <div class="footer-socials">
                <a href="https://www.instagram.com/mouham.ahmad1?stkn=MXA2MXZnZWF2engzNQ==" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.youtube.com/@MoulhammAhmad" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.facebook.com/share/1BFCRRVY5h/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook"></i></a>
            </div>
            <div>Moulham Ahmad. All Rights Reserved.</div>
        </footer>
    </div>
    <script>
        const card = document.getElementById('profileCard');
        document.addEventListener('mousemove', e => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `translateY(-8px) rotateX(${-y/15}deg) rotateY(${x/15}deg) scale(1.02)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'translateY(0) rotateX(0) rotateY(0) scale(1)';
        });
    </script>
</body>
</html>
