<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملهم أحمد | Moulham Ahmad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            background-image: linear-gradient(135deg, #0b0f19 0%, #111e38 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-card {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid transparent;
            background-image:
                linear-gradient(rgba(18, 24, 38, 0.75), rgba(18, 24, 38, 0.75)),
                linear-gradient(135deg, #00f2fe, #4facfe, #ff0844);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            position: relative;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
            50% {
                box-shadow:
                    0 0 30px rgba(0, 242, 254, 0.8),
                    0 0 10px rgba(0, 242, 254, 0.1);
            }
            100% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        }

        .avatar-inner {
            width: 102px;
            height: 102px;
            background-color: #0b0f19;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #00f2fe;
            letter-spacing: 2px;
        }

        .main-card h1 {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-card h2 {
            font-size: 16px;
            color: #4facfe;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid #4facfe;
            border-radius: 50px;
            font-size: 14px;
            color: #a5f3fc;
            margin-bottom: 20px;
            background: rgba(79, 172, 254, 0.1);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
        }

        .bio {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.08),
                transparent
            );
            transition: 0.5s;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.25);
            border-color: #4facfe;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
            font-weight: 600;
            z-index: 1;
        }

        .link-card:hover i {
            transform: scale(1.2);
        }

        .link-card i {
            transition: transform 0.3s ease;
        }

        .link-card i.fa-youtube { color: #ff0000; }
        .link-card i.fa-instagram { color: #e1306c; }
        .link-card i.fa-facebook { color: #1877f2; }
        .link-card i.fa-snapchat { color: #fffc00; }
        .link-card i.fa-linkedin { color: #0a66c2; }

        .arrow-icon {
            color: #94a3b8;
            font-size: 14px;
            transition: transform 0.3s ease;
            z-index: 1;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(-5px);
            color: #00f2fe;
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 10px;
        }

        .footer-socials a {
            color: #94a3b8;
            font-size: 18px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .footer-socials a:hover {
            color: #00f2fe;
            transform: translateY(-3px) scale(1.2);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
