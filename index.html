<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملهم أحمد | Web & App Development</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: rgba(22, 19, 38, 0.7);
            --primary: #8a2be2; 
            --secondary: #00d2ff; 
            --accent: #50c878; 
            --text-main: #ffffff;
            --text-muted: #b8b8d0;
            --border-glow: rgba(138, 43, 226, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding-bottom: 50px;
        }

        /* Profile Header */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 35px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .name-ar { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        .name-en { font-size: 16px; color: var(--secondary); font-weight: 600; margin-bottom: 12px; }
        .tagline {
            font-size: 14px;
            color: var(--accent);
            background: rgba(80, 200, 120, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(80, 200, 120, 0.3);
            font-weight: 600;
        }
        .bio { font-size: 14px; color: var(--text-muted); line-height: 1.6; max-width: 90%; margin: 0 auto; }

        /* Social Links */
        .social-links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .social-btn i { font-size: 20px; }
        .social-btn.youtube:hover { background: rgba(255, 0, 0, 0.15); border-color: #ff0000; }
        .social-btn.youtube i { color: #ff0000; }
        .social-btn.instagram:hover { background: rgba(225, 48, 108, 0.15); border-color: #e1306c; }
        .social-btn.instagram i { color: #e1306c; }
        .social-btn.facebook:hover { background: rgba(24, 119, 242, 0.15); border-color: #1877f2; }
        .social-btn.facebook i { color: #1877f2; }
        .btn-content { display: flex; align-items: center; gap: 15px; }

        /* Projects Section */
        .projects-section { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .section-title { font-size: 18px; font-weight: 700; color: var(--secondary); display: flex; align-items: center; gap: 8px; }
        .projects-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .project-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .project-info { padding: 15px; }
        .project-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .project-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

        footer {
            margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);
            display: flex; flex-direction: column; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; width: 100%;
        }
        .footer-socials { display: flex; gap: 15px; font-size: 16px; }
        .footer-socials a { color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-card">
            <div class="logo-container" title="MA">MA</div>
            <h1 class="name-ar">ملهم أحمد</h1>
            <div class="name-en">Moulham Ahmad</div>
            <div class="tagline">Web & App Development | Content Creator</div>
            <p class="bio">أشارك رحلتي في تطوير المواقع والتطبيقات من الأساسيات وحتى بناء مشاريع حقيقية</p>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="https://www.youtube.com/@MoulhammAhmad" target="_blank" class="social-btn youtube">
                <div class="btn-content">
                    <i class="fa-brands fa-youtube"></i>
                    <span>قناة اليوتيوب</span>
                </div>
                <i class="fa-solid fa-chevron-left" style="font-size: 12px; opacity: 0.6;"></i>
            </a>
            <a href="https://www.instagram.com/mouham.ahmad1?stkn=MXA2MXZnZWF2engzNQ==" target="_blank" class="social-btn instagram">
                <div class="btn-content">
                    <i class="fa-brands fa-instagram"></i>
                    <span>صفحة الانستغرام</span>
                </div>
                <i class="fa-solid fa-chevron-left" style="font-size: 12px; opacity: 0.6;"></i>
            </a>
            <a href="https://www.facebook.com/share/1BFCRRVY5h/" target="_blank" class="social-btn facebook">
                <div class="btn-content">
                    <i class="fa-brands fa-facebook"></i>
                    <span>صفحة الفيسبوك</span>
                </div>
                <i class="fa-solid fa-chevron-left" style="font-size: 12px; opacity: 0.6;"></i>
            </a>
        </div>

        <!-- Projects Gallery -->
        <div class="projects-section">
            <div class="section-title">
                <i class="fa-solid fa-code"></i> معرض مشاريع البرمجة
            </div>
            <div class="projects-grid" id="projectsContainer">
                <!-- المشاريع تظهر هنا تلقائياً -->
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-socials">
                <a href="https://www.instagram.com/mouham.ahmad1?stkn=MXA2MXZnZWF2engzNQ==" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.youtube.com/@MoulhammAhmad" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.facebook.com/share/1BFCRRVY5h/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
            </div>
            <div>Moulham Ahmad. All Rights Reserved.</div>
        </footer>
    </div>

    <script>
        // ضع مشاريعك هنا (عنوان المشروع، الوصف، ورابط الصورة):
        const myProjects = [
            {
                title: "تطبيق آلة حاسبة علمية",
                desc: "موقع آلة حاسبة متطور بتصميم مخصص بلغة HTML CSS JavaScript.",
                image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&auto=format&fit=crop&q=80"
            }
        ];

        document.addEventListener('DOMContentLoaded', loadProjects);

        function loadProjects() {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';

            myProjects.forEach(proj => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <img src="${proj.image}" class="project-img" alt="${proj.title}">
                    <div class="project-info">
                        <div class="project-title">${proj.title}</div>
                        <div class="project-desc">${proj.desc}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
